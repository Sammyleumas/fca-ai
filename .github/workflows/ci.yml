name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/mf_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx next typegen
      - run: npm run lint
      - run: npx tsc --noEmit
      - name: Prepare test database
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
          scripts/db-test-reset.sh
      - run: npx vitest run
      - name: Build (with a dummy Gemini key, to prove it never reaches browser bundles)
        run: npm run build
        env:
          GEMINI_API_KEY: ci-dummy-gemini-key-not-real
      - run: npm run check:client-bundle
        env:
          GEMINI_API_KEY: ci-dummy-gemini-key-not-real
